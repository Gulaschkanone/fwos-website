<div class="topbar">
  <div class="container">
    <span>Im Notfall: <strong>Feuerwehr 118</strong></span>
    <a href="{{ '/kontakt/' | relative_url }}">Kontakt</a>
  </div>
</div>

<header class="site-header">
  <div class="container nav-row">
    <a class="brand" href="{{ '/' | relative_url }}">
      {% if site.logo %}
        <img class="brand-logo" src="{{ site.logo | relative_url }}" alt="{{ site.title }}">
      {% else %}
        <span class="brand-mark">{{ site.short_title | default: site.title | slice: 0, 2 | upcase }}</span>
        <span class="brand-text">
          <span class="name">{{ site.title }}</span>
          <span class="tagline">{{ site.tagline }}</span>
        </span>
      {% endif %}
    </a>

    <button class="nav-toggle" aria-label="Menü öffnen" aria-expanded="false">
      <span></span>
    </button>

    <nav class="main-nav">
      <ul>
        {% for item in site.nav %}
          {% assign item_url = item.url | relative_url %}
          <li>
            <a href="{{ item_url }}"
               {% if page.url == item.url %}class="active"{% endif %}>
              {{ item.title }}
            </a>
          </li>
        {% endfor %}
      </ul>
    </nav>
  </div>
</header>
