---
layout: default
---
<section class="page-hero">
  <div class="container">
    <span class="eyebrow" style="color:#FFD9D3;">{{ page.date | date: "%d.%m.%Y" }} · {{ page.time }} · {{ page.ort }}</span><br>
    <h1>{{ page.title }}</h1>
  </div>
</section>

<article class="page-content">
  <div class="container" style="max-width:760px;">
    {{ content }}
    <p style="margin-top:40px;"><a href="{{ '/einsaetze/' | relative_url }}">&larr; Zurück zur Einsatzübersicht</a></p>
  </div>
</article>
