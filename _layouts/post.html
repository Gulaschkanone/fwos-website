---
layout: default
---
<section class="page-hero">
  <div class="container">
    <span class="eyebrow" style="color:#FFD9D3;">{{ page.date | date: "%d. %B %Y" }}</span><br>
    <h1>{{ page.title }}</h1>
  </div>
</section>

<article class="page-content">
  <div class="container" style="max-width:760px;">
    {{ content }}
    <p style="margin-top:40px;"><a href="{{ '/neuigkeiten/' | relative_url }}">&larr; Zurück zu allen Neuigkeiten</a></p>
  </div>
</article>
